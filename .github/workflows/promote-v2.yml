name: Promote BoxingBot V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: contains(github.event.head_commit.message, 'Stage BoxingBot V2.0.1 migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Expand V2 source
        run: python _unpack_v2.py
      - name: Verify source
        run: |
          python -m compileall -q boxing_bot tests
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("boxing_db.json", "boxing_db -- backup.json"):
              p = Path(name)
              if p.exists():
                  json.loads(p.read_text(encoding="utf-8"))
          assert Path("VERSION").read_text(encoding="utf-8").strip() == "2.0.1"
          assert Path("boxing_bot/cogs/game_menu.py").exists()
          PY
      - name: Clean staging files
        run: |
          rm -f _unpack_v2.py
          rm -f .github/workflows/promote-v2.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "BoxingBot V2.0.1 stable"
          git push origin main
