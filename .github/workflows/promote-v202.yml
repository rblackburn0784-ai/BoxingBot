name: Promote BoxingBot V2.0.2
on:
  push:
    branches: [main]
    paths:
      - '.v202_payload.part*'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify V2.0.2 payload
        run: |
          cat .v202_payload.part* | base64 -d > .v202_payload.tar.gz
          echo '288a7465d0744bba04b5fc4a5db003a504a05f58514557dcd980e74d16541f57  .v202_payload.tar.gz' | sha256sum -c -
          tar -tzf .v202_payload.tar.gz >/dev/null
          tar -xzf .v202_payload.tar.gz
      - name: Verify source
        run: |
          python -m compileall -q boxing_bot tests
          PYTHONPATH=. python tests/regression_core.py
          PYTHONPATH=. python tests/v2_core.py
          PYTHONPATH=. python tests/v202_stabilisation.py
          python - <<'PY'
          import json
          json.load(open('boxing_db.json',encoding='utf-8'))
          json.load(open('boxing_db -- backup.json',encoding='utf-8'))
          assert open('VERSION',encoding='utf-8').read().strip() == '2.0.2'
          print('V2.0.2 verification PASS')
          PY
      - name: Remove promotion payload and workflow
        run: rm -f .v202_payload.tar.gz .v202_payload.part* .github/workflows/promote-v202.yml
      - name: Commit stable release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'BoxingBot V2.0.2 — Stabilisation, Media & Balance'
          git push origin main
